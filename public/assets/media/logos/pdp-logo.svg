<svg width="300" height="100" viewBox="0 0 300 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- PDP Logo Full -->
  <g>
    <!-- Gradient background circle -->
    <defs>
      <linearGradient id="pdpGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#1a73e8;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#185abc;stop-opacity:1" />
      </linearGradient>
    </defs>
    
    <!-- Circle background -->
    <circle cx="50" cy="50" r="45" fill="url(#pdpGradient)"/>
    
    <!-- Inner circle accent -->
    <circle cx="50" cy="50" r="40" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
    
    <!-- Letter P (Primary Color) -->
    <text x="18" y="68" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff">P</text>
    
    <!-- Letter D (Success Color) -->
    <text x="42" y="68" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#34a853">D</text>
    
    <!-- Letter P (Orange Color) -->
    <text x="66" y="68" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#fa7b17">P</text>
  </g>
  
  <!-- Text "PDP" -->
  <text x="125" y="60" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#1a73e8">PDP</text>
  
  <!-- Subtitle -->
  <text x="125" y="82" font-family="Arial, sans-serif" font-size="14" fill="#5f6368">Professional Development Programme</text>
</svg>
